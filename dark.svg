            <g transform="translate(72,0)"><rect width="76" height="30" rx="15" fill="#0B1120" stroke="#22D3EE" stroke-opacity="0.55" filter="url(#softGlow)"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" begin="0.2s" repeatCount="indefinite"/></rect><text x="38" y="20" text-anchor="middle" fill="#F8FAFC">Next.js</text></g>
            <g transform="translate(158,0)"><rect width="80" height="30" rx="15" fill="#0B1120" stroke="#10B981" stroke-opacity="0.55" filter="url(#softGlow)"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" begin="0.4s" repeatCount="indefinite"/></rect><text x="40" y="20" text-anchor="middle" fill="#F8FAFC">Node.js</text></g>
