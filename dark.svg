            <animate attributeName="opacity" begin="8s" dur="20s" repeatCount="indefinite" keyTimes="0;0.015;0.17;0.185;1" values="0;1;1;0;0"/>
            <text x="52" y="164" fill="#F8FAFC">Full Stack Developer</text>
            <rect x="279" y="150" width="9" height="18" fill="#7C3AED"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
