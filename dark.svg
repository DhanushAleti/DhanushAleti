            <animate attributeName="opacity" begin="0s" dur="20s" repeatCount="indefinite" keyTimes="0;0.015;0.17;0.185;1" values="0;1;1;0;0"/>
            <text x="52" y="164" fill="#F8FAFC">Software Engineer</text>
            <rect x="246" y="150" width="9" height="18" fill="#7C3AED"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
          </g>
          <g opacity="0">
            <animate attributeName="opacity" begin="4s" dur="20s" repeatCount="indefinite" keyTimes="0;0.015;0.17;0.185;1" values="0;1;1;0;0"/>
            <text x="52" y="164" fill="#F8FAFC">AI / ML Engineer</text>
            <rect x="225" y="150" width="9" height="18" fill="#7C3AED"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
