          <g opacity="0"><text x="30" y="300"><tspan fill="#7C3AED">✉</tspan>  aletidhanush9999@gmail.com</text><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.5s" fill="freeze"/></g>
        </g>

