          </g>
        </g>

        <line x1="30" y1="190" x2="630" y2="190" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <g font-family="'JetBrains Mono',monospace" font-size="14.5" fill="#94A3B8">
          <g opacity="0"><text x="30" y="222"><tspan fill="#22D3EE">📍</tspan> Hyderabad, India</text><animate attributeName="opacity" values="0;1" begin="1.4s" dur="0.5s" fill="freeze"/></g>
          <g opacity="0"><text x="30" y="248"><tspan fill="#7C3AED">🎓</tspan> B.Tech Chemical Engg. + BS Data Science, IIT Madras</text><animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.5s" fill="freeze"/></g>
