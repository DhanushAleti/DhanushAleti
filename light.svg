        <text x="46" y="414" font-size="12.5" fill="#475569" opacity="0" xml:space="preserve">Python · TypeScript · PyTorch · FastAPI · Next.js · React · Postgres · Docker<animate attributeName="opacity" values="0;1" begin="2.15s" dur="0.5s" fill="freeze"/></text>
