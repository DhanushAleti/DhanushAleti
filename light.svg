      <animateTransform attributeName="transform" type="translate" additive="sum"
                        values="0,0; 0,-6; 0,0" dur="6s" repeatCount="indefinite"/>
      <g clip-path="url(#wipeL)" font-family="'JetBrains Mono','SFMono-Regular',Menlo,monospace"
         font-size="11" fill="url(#ascL)" filter="url(#pglowL)">
        <text x="0" y="12" xml:space="preserve">.:::::------============================-----:::::</text>
        <text x="0" y="24" xml:space="preserve">.:::::-----=============================------::::</text>
        <text x="0" y="36" xml:space="preserve">:::::-----===============================------:::</text>
        <text x="0" y="48" xml:space="preserve">::::------=================================-----::</text>
        <text x="0" y="60" xml:space="preserve">::::------==================================----::</text>
        <text x="0" y="72" xml:space="preserve">:::::----------------------=================-----:</text>
        <text x="0" y="84" xml:space="preserve">::::::--------------------------=============----:</text>
