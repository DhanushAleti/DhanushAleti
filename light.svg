    <!-- ── RIGHT: identity card ─────────────────────────────────────────── -->
    <g transform="translate(440,70)">
      <rect width="700" height="470" rx="20" fill="#FFFFFF" fill-opacity="0.72"
            stroke="rgba(15,23,42,0.10)" stroke-width="1"/>
      <rect width="700" height="470" rx="20" fill="url(#sheenL)">
        <animateTransform attributeName="transform" type="translate" values="-55,0; 55,0; -55,0" dur="10s" repeatCount="indefinite"/>
      </rect>
      <rect width="700" height="470" rx="20" fill="none" stroke="url(#brdL)" stroke-width="1.4"
            stroke-dasharray="78 2262" opacity="0.9">
        <animate attributeName="stroke-dashoffset" values="0;-2340" dur="10s" repeatCount="indefinite"/>
      </rect>

      <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">
        <g clip-path="url(#nameWipeL)">
          <text x="46" y="96" font-size="42" font-weight="700" letter-spacing="-1" fill="#0F172A">Dhanush Aleti</text>
        </g>

        <rect x="46" y="116" width="0" height="2.5" rx="1.25" fill="url(#ruleL)">
          <animate attributeName="width" values="0;150" dur="0.7s" begin="1.05s" fill="freeze"/>
        </rect>

        <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,monospace" font-size="19" font-weight="500">
        <g opacity="0">
          <animate attributeName="opacity" begin="0s" dur="12s" repeatCount="indefinite"
                   keyTimes="0;0.02;0.313;0.333;1" values="0;1;1;0;0"/>
          <text x="46" y="162" fill="#0F172A">Software Engineer</text>
          <rect x="247.1" y="148" width="9" height="18" fill="#2563EB">
            <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" begin="4s" dur="12s" repeatCount="indefinite"
                   keyTimes="0;0.02;0.313;0.333;1" values="0;1;1;0;0"/>
          <text x="46" y="162" fill="#0F172A">AI / ML Engineer</text>
          <rect x="235.7" y="148" width="9" height="18" fill="#2563EB">
            <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
        <g opacity="0">
          <animate attributeName="opacity" begin="8s" dur="12s" repeatCount="indefinite"
                   keyTimes="0;0.02;0.313;0.333;1" values="0;1;1;0;0"/>
          <text x="46" y="162" fill="#0F172A">Full-Stack Developer</text>
          <rect x="281.4" y="148" width="9" height="18" fill="#2563EB">
            <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
          </rect>
        </g>
        </g>

        <line x1="46" y1="192" x2="654" y2="192" stroke="rgba(15,23,42,0.10)" stroke-width="1"/>

        <g font-family="'JetBrains Mono','SFMono-Regular',Menlo,monospace">
        <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.55s" dur="0.5s" fill="freeze"/>
          <text x="46" y="230" font-size="10" letter-spacing="2.2" fill="#94A3B8">LOCATION</text>
          <text x="46" y="254" font-size="15.5" fill="#475569">Hyderabad, India</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.69s" dur="0.5s" fill="freeze"/>
          <text x="366" y="230" font-size="10" letter-spacing="2.2" fill="#94A3B8">EDUCATION</text>
          <text x="366" y="254" font-size="15.5" fill="#475569">IIT Madras</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.83s" dur="0.5s" fill="freeze"/>
          <text x="46" y="292" font-size="10" letter-spacing="2.2" fill="#94A3B8">FOCUS</text>
          <text x="46" y="316" font-size="15.5" fill="#475569">AI systems &amp; tooling</text>
        </g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.9700000000000002s" dur="0.5s" fill="freeze"/>
          <text x="366" y="292" font-size="10" letter-spacing="2.2" fill="#94A3B8">OPEN TO</text>
          <text x="366" y="316" font-size="15.5" fill="#475569">SWE / AI Engineer roles</text>
